kind = "web"
previewPath = "/"
title = "Emergency Contact Manager"
description = "A straightforward emergency contact management web app for adding, searching, editing, viewing, and deleting contact records with persistent storage."
version = "1.0.0"
id = "artifacts/emergency-contact-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20388

[services.development]
run = "pnpm --filter @workspace/emergency-contact-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/emergency-contact-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/emergency-contact-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20388"
BASE_PATH = "/"
